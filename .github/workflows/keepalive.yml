name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping healthz (houdt Render-service 24/7 wakker)
        run: |
          curl -sS -m 60 -o /dev/null -w "healthz HTTP %{http_code}\n" https://yz-finance.onrender.com/healthz
          sleep 240
          curl -sS -m 60 -o /dev/null -w "healthz HTTP %{http_code}\n" https://yz-finance.onrender.com/healthz